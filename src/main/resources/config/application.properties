# ==============================================================================
# Road Damage Inspection Framework - Runtime Configuration Defaults
# ==============================================================================

# Number of intra-operator execution threads allocated per ONNX Runtime session.
# Default: 4 (or min(4, availableProcessors))
ORT_INTRA_OP_THREADS=4

# Frame subsampling stride (1 = inspect every frame, 2 = inspect every 2nd frame, etc.)
# Default: 1
FRAME_STRIDE=1

# Maximum capacity of the bounded in-memory frame ingestion queue.
# Range: [1, 64]. Default: 16
QUEUE_CAPACITY=16

# Stage 1 MobileNetV3 screening distress probability threshold.
# Default: 0.50
STAGE1_DAMAGE_THRESHOLD=0.50

# Whether to bypass Stage 2 detection and Stage 3 assessment when Stage 1 finds no distress.
# Default: true
SKIP_STAGE2_WHEN_CLEAN=true

# ------------------------------------------------------------------------------
# Recommended JVM Flags for High-Throughput Native Pipeline Execution:
# -Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=50
# ------------------------------------------------------------------------------
